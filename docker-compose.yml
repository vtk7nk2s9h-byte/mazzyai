# Local Postgres for Prisma. Bring it up with:
#
#   docker compose up -d
#
# The app runs on the host: `pnpm dev`, reading DATABASE_URL from .env
# (localhost:5433).
#
# The credentials here are deliberately boring and local-only. Nothing in this
# file should ever hold a real secret — those come from .env at run time.
#
# -----------------------------------------------------------------------------
# Running the app in Docker too — kept for later, currently disabled.
# -----------------------------------------------------------------------------
# To re-enable: uncomment the `app:` block below, then
#
#   docker compose up -d --build     # first run, or after changing deps
#   docker compose logs -f app       # watch the dev server
#
# Three things that must move with it:
#   1. Dockerfile.dev and .dockerignore are still on disk and still correct.
#   2. next.config.ts has the matching `watchOptions` block commented out; it
#      is what DOCKER_DEV below switches on.
#   3. Hot reload never worked through the Windows bind mount even with
#      polling — edits needed `docker compose restart app`. Docker Desktop's
#      synchronized file shares is the thing to try before re-enabling.
#
# services:
#   app:
#     build:
#       context: .
#       dockerfile: Dockerfile.dev
#     container_name: mazzyai-app
#     restart: unless-stopped
#     ports:
#       - '3000:3000'
#     env_file:
#       # AUTH_SECRET and the API keys. DATABASE_URL is in here too
#       # but is overridden below — `environment` wins over `env_file`.
#       - .env
#     environment:
#       # Inside the compose network the database is `postgres:5432`. The
#       # host's localhost:5433 mapping does not exist in here, and `localhost`
#       # would resolve to this container itself.
#       DATABASE_URL: postgresql://postgres:postgres@postgres:5432/mazzyai
#       # Turns on watchOptions.pollIntervalMs in next.config.ts. Windows bind
#       # mounts deliver no inotify events into Linux, so without polling the
#       # dev server never sees an edit.
#       DOCKER_DEV: 'true'
#     volumes:
#       # Source is mounted so edits on the host reload in the container.
#       - .:/app
#       # Anonymous volumes shadow the mount for these two: node_modules must
#       # stay the Linux build from the image, and .next must not be shared with
#       # a host dev server writing Windows paths into it.
#       - /app/node_modules
#       - /app/.next
#     depends_on:
#       postgres:
#         # Waits for pg_isready, not merely for the container to start —
#         # otherwise the first query races Postgres's startup.
#         condition: service_healthy

# Fixed rather than taken from the folder name, so renaming or moving the
# checkout keeps the same containers and volume. (The older checkout's stack is
# "mazzyai-test", so the two never share a project.)
name: mazzyai

services:
  postgres:
    image: postgres:17-alpine
    container_name: mazzyai-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mazzyai
    ports:
      # Host 5433, not 5432: this machine runs a native PostgreSQL service that
      # already owns 5432, and it answers localhost first — connections meant
      # for this container silently reach that server instead. Keep these in
      # step with DATABASE_URL in .env.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets `docker compose up --wait` block until the server actually
      # accepts connections, rather than just until the container starts.
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mazzyai']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
    # Explicit for the same reason as `name:` above.
    name: mazzyai-db-data
